[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velorum"
version = "0.1.0"
description = "AI Coding Agent with Human-in-the-Loop support"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danish", email = "danish@example.com" }
]
keywords = [
    "ai",
    "coding-agent", 
    "llm",
    "langchain",
    "langgraph",
    "automation",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"

dependencies = [
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Additional LLM providers
anthropic = ["langchain-anthropic>=0.3.0"]
google = ["langchain-google-genai>=2.0.0"]
groq = ["langchain-groq>=0.2.0"]
mistral = ["langchain-mistralai>=0.2.0"]
together = ["langchain-together>=0.2.0"]
fireworks = ["langchain-fireworks>=0.2.0"]

# All providers
all = [
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-mistralai>=0.2.0",
    "langchain-together>=0.2.0",
    "langchain-fireworks>=0.2.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
velorum = "velorum.cli:main"

[project.urls]
Homepage = "https://github.com/your-repo/velorum"
Documentation = "https://github.com/your-repo/velorum#readme"
Repository = "https://github.com/your-repo/velorum"
Issues = "https://github.com/your-repo/velorum/issues"

[tool.hatch.build.targets.wheel]
packages = ["velorum"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

